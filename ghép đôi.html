
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dova Ghép Đôi Online</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: linear-gradient(145deg,#161b38,#38275b);
  color: white;
  font-family: Arial,sans-serif;
  text-align: center;
  min-height: 100vh;
}

h1 { color: #ffe27a; margin-bottom: 5px; }
p { color: #dedcf4; }

.panel {
  background: #ffffff12;
  border: 1px solid #ffffff25;
  border-radius: 16px;
  padding: 14px;
  margin: 12px auto;
  max-width: 480px;
}

input {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 0;
  margin: 5px 0;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.action {
  width: 100%;
  margin-top: 7px;
  background: #ffe27a;
  color: #25203d;
}

#roomInfo {
  overflow-wrap: anywhere;
  font-weight: bold;
}

#board {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 8px;
  max-width: 440px;
  margin: 16px auto;
}

.card {
  width: 100%;
  aspect-ratio: 0.82;
  min-width: 0;
  padding: 0;
  border-radius: 12px;
  font-size: clamp(24px,8vw,42px);
  background: #7b70dc;
  color: white;
  box-shadow: 0 4px 0 #453d91;
}

.card.open {
  background: #fff2bf;
  color: #30284a;
}

.card.matched {
  background: #72d6a0;
  color: #173c2c;
  box-shadow: 0 4px 0 #33875a;
}

.card:disabled { opacity: 1; }

.small {
  font-size: 13px;
  color: #d9d3fa;
}

#status {
  min-height: 44px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.hidden { display: none !important; }
</style>
</head>

<body>
<h1>💜 DOVA GHÉP ĐÔI</h1>
<p>Ghép nhân vật giống nhau cùng bạn bè!</p>

<section class="panel" id="loginPanel">
  <input id="playerName" maxlength="14"
    placeholder="Nhập tên hiển thị" autocomplete="nickname">

  <button class="action" id="createBtn">🎮 Tạo phòng mới</button>

  <input id="roomInput" maxlength="6"
    placeholder="Nhập mã phòng, ví dụ A2B3C4"
    autocapitalize="characters">

  <button class="action" id="joinBtn">🔑 Vào phòng bạn bè</button>

  <p class="small">
    Cả hai người đều cần kết nối Internet.
  </p>
</section>

<section class="panel hidden" id="gamePanel">
  <div id="roomInfo">Mã phòng: ---</div>
  <div id="playersInfo"></div>
  <p id="status">Đang tải phòng...</p>
  <div id="board"></div>
  <p class="small">
    Ghép hai nhân vật giống nhau để ghi điểm.
  </p>
  <button class="action" id="copyBtn">📋 Sao chép mã phòng</button>
</section>

<p class="small" id="connection">Đang kết nối Firebase...</p>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth, signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getDatabase, ref, get, set, onValue, off, runTransaction
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

// THAY CAC GIA TRI DUOI DAY BANG CAU HINH FIREBASE CUA BAN
const firebaseConfig = {
  apiKey: "DAN_API_KEY",
  authDomain: "TEN_PROJECT.firebaseapp.com",
  databaseURL: "DAN_DATABASE_URL",
  projectId: "TEN_PROJECT",
  appId: "DAN_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let uid = null;
let roomCode = null;
let currentRoom = null;
let scheduledRevealAt = null;

const $ = id => document.getElementById(id);

function showMessage(message) {
  $("status").textContent = message;
}

function getPlayerName() {
  return $("playerName").value.trim().slice(0, 14) || "Người chơi";
}

function makeCards() {
  const characters = ["🐱","🐶","🐼","🦊","🐸","🐵"];
  const cards = [];

  characters.forEach((face, index) => {
    cards.push({ id: index * 2, face, matched: false });
    cards.push({ id: index * 2 + 1, face, matched: false });
  });

  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }

  return cards;
}

function makeCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result = "";

  for (let i = 0; i < 6; i++) {
    result += chars[Math.floor(Math.random() * chars.length)];
  }

  return result;
}

function roomRef(code = roomCode) {
  return ref(db, "rooms/" + code);
}

function enterRoom(code) {
  if (roomCode) off(roomRef(roomCode));

  roomCode = code;
  currentRoom = null;
  scheduledRevealAt = null;

  $("loginPanel").classList.add("hidden");
  $("gamePanel").classList.remove("hidden");
  $("roomInfo").textContent = "Mã phòng: " + code;

  onValue(roomRef(), snapshot => {
    const room = snapshot.val();

    if (!room) {
      currentRoom = null;
      showMessage("Không tìm thấy phòng.");
      return;
    }

    currentRoom = room;
    renderRoom(room);
    scheduleMismatchClear(room);
  }, error => {
    showMessage("Lỗi đọc phòng: " + error.message);
  });
}

async function createRoom() {
  if (!uid) return alert("Đang kết nối, hãy thử lại sau.");

  try {
    let code = "";
    let found = false;

    for (let i = 0; i < 5; i++) {
      code = makeCode();
      const snapshot = await get(ref(db, "rooms/" + code));

      if (!snapshot.exists()) {
        found = true;
        break;
      }
    }

    if (!found) {
      throw new Error("Không tạo được mã phòng. Hãy thử lại.");
    }

    const room = {
      host: uid,
      status: "waiting",
      turn: uid,
      players: {
        [uid]: {
          name: getPlayerName(),
          score: 0
        }
      },
      cards: makeCards(),
      flipped: [],
      createdAt: Date.now()
    };

    await set(ref(db, "rooms/" + code), room);
    enterRoom(code);
  } catch (error) {
    alert("Không tạo được phòng: " + error.message);
  }
}

async function joinRoom() {
  if (!uid) return alert("Đang kết nối, hãy thử lại sau.");

  const code = $("roomInput").value.trim().toUpperCase();

  if (!/^[A-Z0-9]{6}$/.test(code)) {
    return alert("Mã phòng phải gồm 6 chữ hoặc số.");
  }

  try {
    const result = await runTransaction(ref(db, "rooms/" + code), room => {
      if (!room) return;

      if (!room.players) room.players = {};
      const players = room.players;
      const playerIds = Object.keys(players);

      if (players[uid]) {
        players[uid].name = getPlayerName();
        return room;
      }

      if (playerIds.length >= 2 || room.status !== "waiting") {
        return;
      }

      players[uid] = {
        name: getPlayerName(),
        score: 0
      };

      room.status = "playing";
      return room;
    });

    const room = result.snapshot.val();

    if (!result.committed || !room ||
        !room.players || !room.players[uid]) {
      alert("Phòng không tồn tại hoặc đã đủ người.");
      return;
    }

    enterRoom(code);
  } catch (error) {
    alert("Không vào được phòng: " + error.message);
  }
}

function renderRoom(room) {
  const players = room.players || {};
  const ids = Object.keys(players);

  $("playersInfo").textContent = ids.map((id, index) => {
    const player = players[id];
    const turnMark = room.turn === id ? " 🎯" : "";
    return (index + 1) + ". " + player.name +
      " — " + (player.score || 0) + " điểm" + turnMark;
  }).join(" | ");

  const board = $("board");
  board.replaceChildren();

  const flipped = room.flipped || [];
  const revealPending = Boolean(room.revealAt);

  (room.cards || []).forEach((card, index) => {
    const button = document.createElement("button");
    const isOpen = flipped.includes(index);
    const isMatched = Boolean(card.matched);

    button.className = "card";
    if (isOpen) button.classList.add("open");
    if (isMatched) button.classList.add("matched");

    button.textContent = (isOpen || isMatched) ? card.face : "?";

    button.disabled =
      room.status !== "playing" ||
      room.turn !== uid ||
      revealPending ||
      isMatched ||
      isOpen;

    button.addEventListener("click", () => flipCard(index));
    board.appendChild(button);
  });

  if (room.status === "waiting") {
    showMessage("Đang chờ người thứ hai. Hãy gửi mã phòng cho bạn!");
  } else if (room.status === "playing") {
    if (room.turn === uid) {
      showMessage("Đến lượt bạn! Chọn một lá bài.");
    } else {
      const nextPlayer = players[room.turn];
      showMessage("Đang chờ " +
        (nextPlayer ? nextPlayer.name : "đối thủ") + " chọn bài.");
    }
  } else if (room.status === "finished") {
    const sorted = ids.slice().sort((a, b) =>
      (players[b].score || 0) - (players[a].score || 0)
    );

    if (sorted.length < 2 ||
        players[sorted[0]].score === players[sorted[1]].score) {
      showMessage("🤝 Trận đấu hòa!");
    } else {
      showMessage("🏆 Người thắng: " + players[sorted[0]].name);
    }
  } else {
    showMessage("Trạng thái phòng không xác định.");
  }
}

async function flipCard(index) {
  if (!uid || !roomCode) return;

  try {
    await runTransaction(roomRef(), room => {
      if (!room || room.status !== "playing") return;
      if (room.turn !== uid || room.revealAt) return;
      if (!room.cards || !room.cards[index]) return;
      if (room.cards[index].matched) return;

      const flipped = room.flipped || [];
      if (flipped.includes(index)) return;

      if (flipped.length === 0) {
        room.flipped = [index];
        return room;
      }

      if (flipped.length !== 1) return;

      const firstIndex = flipped[0];
      const first = room.cards[firstIndex];
      const second = room.cards[index];

      room.flipped = [firstIndex, index];

      if (first.face === second.face) {
        room.cards[firstIndex].matched = true;
        room.cards[index].matched = true;
        room.players[uid].score =
          (room.players[uid].score || 0) + 1;
        room.flipped = [];

        const allMatched = room.cards.every(card => card.matched);
        if (allMatched) room.status = "finished";
      } else {
        const otherPlayer = Object.keys(room.players)
          .find(id => id !== uid);

        room.pendingNext = otherPlayer;
        room.revealAt = Date.now() + 1200;
      }

      return room;
    });
  } catch (error) {
    showMessage("Lỗi lật bài: " + error.message);
  }
}

function scheduleMismatchClear(room) {
  if (!room.revealAt) {
    scheduledRevealAt = null;
    return;
  }

  const targetTime = room.revealAt;

  if (scheduledRevealAt === targetTime) return;
  scheduledRevealAt = targetTime;

  const delay = Math.max(0, targetTime - Date.now() + 100);

  setTimeout(async () => {
    try {
      await runTransaction(roomRef(), current => {
        if (!current || current.revealAt !== targetTime) return;

        current.flipped = [];
        current.turn = current.pendingNext || current.turn;
        delete current.pendingNext;
        delete current.revealAt;

        return current;
      });
    } catch (error) {
      console.error(error);
    }
  }, delay);
}

$("createBtn").addEventListener("click", createRoom);
$("joinBtn").addEventListener("click", joinRoom);

$("copyBtn").addEventListener("click", async () => {
  if (!roomCode) return;

  try {
    await navigator.clipboard.writeText(roomCode);
    alert("Đã sao chép mã phòng: " + roomCode);
  } catch {
    prompt("Hãy sao chép mã phòng này:", roomCode);
  }
});

try {
  if (!auth.currentUser) {
    await signInAnonymously(auth);
  }

  uid = auth.currentUser.uid;
  $("connection").textContent = "✅ Đã kết nối tài khoản khách.";
} catch (error) {
  $("connection").textContent =
    "❌ Lỗi Firebase: " + error.message +
    ". Hãy kiểm tra cấu hình và Authentication.";
}
</script>
</body>
</html>
